## model
model_name_or_path: REPLACE_WITH_MODEL_PATH
enable_liger_kernel: true
### method
stage: sft
do_train: true
finetuning_type: full
### ddp
ddp_timeout: 180000000
deepspeed: REPLACE_WITH_DEEPSPEED_CONFIG
flash_attn: fa2
### dataset
dataset: attribution_200k
template: qwen
cutoff_len: 32768
packing: true
overwrite_cache: true
preprocessing_num_workers: 32
seed: 42
### output
output_dir: REPLACE_WITH_OUTPUT_DIR
logging_steps: 1
save_steps: 25
save_strategy: steps
plot_loss: true
overwrite_output_dir: false
### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 5.0e-5
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
max_grad_norm: 1.0
weight_decay: 0.1
num_train_epochs: 6.0
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs: {'min_lr': 1.0e-5}
warmup_ratio: 0.1
bf16: true
save_only_model: false
save_total_limit: 2